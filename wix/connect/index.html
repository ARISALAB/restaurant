<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Connect to Wix · TableReserve</title>
<link rel="icon" href="/favicon.svg">
<!-- Ανοίγει από τη σελίδα του TableReserve στο dashboard του Wix (νέα καρτέλα, #i=<instance>).
     Ο ιδιοκτήτης συνδέεται στο TableReserve και επιβεβαιώνει ποιο κατάστημα συνδέεται με το site. -->
<style>
  :root { --blue:#2563eb; --ink:#0f172a; --muted:#475569; --line:#e2e8f0; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
         font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:#f4f6fb; }
  .card { width:100%; max-width:420px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:28px 24px; box-shadow:0 10px 30px rgba(15,23,42,.06); }
  .brand { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:18px; font-weight:700; font-size:18px; }
  .brand img { width:34px; height:34px; border-radius:8px; }
  .brand span.x { color:#94a3b8; font-weight:400; }
  h1 { font-size:20px; text-align:center; margin:0 0 6px; }
  p.sub { text-align:center; color:var(--muted); margin:0 0 20px; }
  label { display:block; font-size:13px; font-weight:600; margin:12px 0 4px; }
  input { width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px; font:inherit; }
  input:focus { outline:2px solid #bfdbfe; border-color:var(--blue); }
  .btn { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:10px; padding:12px 16px;
         font:600 15px/1 inherit; font-family:inherit; cursor:pointer; margin-top:16px; text-decoration:none; }
  .btn-primary { background:var(--blue); color:#fff; }
  .btn-primary:disabled { opacity:.6; cursor:default; }
  .btn-google { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .or { display:flex; align-items:center; gap:10px; color:#94a3b8; font-size:13px; margin:18px 0 0; }
  .or::before, .or::after { content:""; flex:1; height:1px; background:var(--line); }
  .links { text-align:center; font-size:13px; margin-top:16px; color:var(--muted); }
  .links a { color:var(--blue); }
  .shop { text-align:center; background:#f8fafc; border:1px solid var(--line); border-radius:12px; padding:14px; margin:4px 0 6px; }
  .shop b { display:block; font-size:18px; }
  .shop small { color:var(--muted); }
  .msg { display:none; border-radius:10px; padding:10px 12px; font-size:14px; margin-top:14px; }
  .msg.err { display:block; background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
  .done { text-align:center; }
  .done .tick { width:56px; height:56px; border-radius:50%; background:#dcfce7; color:#16a34a; font-size:30px; line-height:56px; margin:0 auto 12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><img src="/favicon.svg" alt="">TableReserve <span class="x">×</span> Wix</div>

  <div id="v-loading" style="text-align:center;color:#475569;">…</div>

  <!-- Σύνδεση στο TableReserve -->
  <section id="v-login" hidden>
    <h1 data-t="login_title"></h1>
    <p class="sub" data-t="login_sub"></p>
    <button class="btn btn-google" id="btn-google" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      <span data-t="google"></span>
    </button>
    <div class="or" data-t="or"></div>
    <form id="f-login">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="pass" data-t="password"></label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <button class="btn btn-primary" id="btn-login" type="submit" data-t="sign_in"></button>
    </form>
    <div class="links">
      <a href="/admin/" target="_blank" rel="noopener" data-t="forgot"></a> ·
      <a id="lnk-signup" target="_blank" rel="noopener" data-t="no_account"></a>
    </div>
  </section>

  <!-- Επιβεβαίωση -->
  <section id="v-confirm" hidden>
    <h1 data-t="confirm_title"></h1>
    <p class="sub" data-t="confirm_sub"></p>
    <div class="shop"><b id="shop-name"></b><small id="user-email"></small></div>
    <button class="btn btn-primary" id="btn-connect" type="button" data-t="connect"></button>
    <div class="links"><a href="#" id="lnk-switch" data-t="switch"></a></div>
  </section>

  <!-- Έτοιμο -->
  <section id="v-done" class="done" hidden>
    <div class="tick">✓</div>
    <h1 data-t="done_title"></h1>
    <p class="sub" data-t="done_sub"></p>
    <button class="btn btn-primary" id="btn-close" type="button" data-t="close"></button>
  </section>

  <div class="msg" id="msg"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const app = initializeApp({
    apiKey: "AIzaSyCEkDMQ2Q3N886s8SyG03p6ZgzwO3N4pX4",
    authDomain: "tablereserve.gr",
    databaseURL: "https://reser-dfb9a-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "reser-dfb9a",
  });
  const auth = getAuth(app);

  const qs = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.slice(1));
  const INSTANCE = hash.get('i') || '';
  // Το instance δεν μένει στη γραμμή διευθύνσεων
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  const L = (qs.get('lang') || navigator.language || 'en').slice(0, 2).toLowerCase() === 'el' ? 'el' : 'en';

  const T = {
    en: {
      login_title: 'Sign in to TableReserve', login_sub: 'Use the account you manage your restaurant with.',
      google: 'Continue with Google', or: 'or', password: 'Password', sign_in: 'Sign in',
      forgot: 'Forgot password?', no_account: 'Create an account',
      confirm_title: 'Connect this restaurant?', confirm_sub: 'Its booking form will appear on your Wix site.',
      connect: 'Connect to my Wix site', switch: 'Use a different account',
      done_title: 'Connected!', done_sub: 'Go back to the Wix tab. The TableReserve page updates by itself.', close: 'Close this tab',
      e_creds: 'Wrong email or password.', e_popup: 'The Google window was closed or blocked. Try again.',
      e_token: 'This link has expired. Go back to your Wix dashboard and click “Connect my restaurant” again.',
      e_no_shop: 'This account has no restaurant yet. Create one first, then try again.',
      e_draft: 'Your restaurant isn’t activated yet. Activate it in TableReserve admin, then try again.',
      e_closed: 'This restaurant account is closed.', e_owner: 'Only the owner of the Wix site can connect it.',
      e_server: 'Something went wrong. Please try again.', e_missing: 'Open this page from the TableReserve app in your Wix dashboard.'
    },
    el: {
      login_title: 'Σύνδεση στο TableReserve', login_sub: 'Με τον λογαριασμό που διαχειρίζεστε το κατάστημα.',
      google: 'Συνέχεια με Google', or: 'ή', password: 'Κωδικός', sign_in: 'Σύνδεση',
      forgot: 'Ξεχάσατε τον κωδικό;', no_account: 'Δημιουργία λογαριασμού',
      confirm_title: 'Σύνδεση αυτού του καταστήματος;', confirm_sub: 'Η φόρμα κράτησής του θα εμφανίζεται στο site σας στο Wix.',
      connect: 'Σύνδεση με το site μου στο Wix', switch: 'Άλλος λογαριασμός',
      done_title: 'Συνδέθηκε!', done_sub: 'Γυρίστε στην καρτέλα του Wix. Η σελίδα του TableReserve ενημερώνεται μόνη της.', close: 'Κλείσιμο καρτέλας',
      e_creds: 'Λάθος email ή κωδικός.', e_popup: 'Το παράθυρο της Google έκλεισε ή μπλοκαρίστηκε. Δοκιμάστε ξανά.',
      e_token: 'Ο σύνδεσμος έληξε. Γυρίστε στο dashboard του Wix και πατήστε ξανά «Σύνδεση καταστήματος».',
      e_no_shop: 'Αυτός ο λογαριασμός δεν έχει κατάστημα. Δημιουργήστε πρώτα ένα και δοκιμάστε ξανά.',
      e_draft: 'Το κατάστημα δεν έχει ενεργοποιηθεί ακόμα. Ενεργοποιήστε το στο admin και δοκιμάστε ξανά.',
      e_closed: 'Ο λογαριασμός αυτού του καταστήματος έχει κλείσει.', e_owner: 'Μόνο ο ιδιοκτήτης του site στο Wix μπορεί να το συνδέσει.',
      e_server: 'Κάτι πήγε στραβά. Δοκιμάστε ξανά.', e_missing: 'Ανοίξτε αυτή τη σελίδα από την εφαρμογή TableReserve στο dashboard του Wix.'
    }
  };
  const t = k => (T[L] && T[L][k]) || T.en[k] || k;
  document.documentElement.lang = L;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.getAttribute('data-t')); });
  document.getElementById('lnk-signup').href = 'https://tablereserve.gr/' + (L === 'el' ? '' : 'en/') + '?ref=wix#signupWrap';

  const $ = id => document.getElementById(id);
  const msg = (k) => { const m = $('msg'); if (!k) { m.className = 'msg'; m.textContent = ''; return; } m.className = 'msg err'; m.textContent = t(k); };
  const view = (v) => ['loading', 'login', 'confirm', 'done'].forEach(n => { $('v-' + n).hidden = n !== v; });

  const ERR = { invalid_wix_token: 'e_token', not_site_owner: 'e_owner', no_shop: 'e_no_shop', shop_draft: 'e_draft', shop_closed: 'e_closed' };

  async function call(action) {
    const user = auth.currentUser;
    const idToken = user ? await user.getIdToken() : '';
    const r = await fetch('/.netlify/functions/wix-connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
      body: JSON.stringify({ action, instance: INSTANCE })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'server');
    return d;
  }

  if (!INSTANCE) { view(''); msg('e_missing'); }
  else {
    onAuthStateChanged(auth, async (user) => {
      msg('');
      if (!user || user.isAnonymous) { view('login'); return; }
      try {
        const d = await call('preview');
        $('shop-name').textContent = d.name;
        $('user-email').textContent = user.email || '';
        view('confirm');
      } catch (e) {
        view(e.message === 'invalid_wix_token' || e.message === 'not_site_owner' ? '' : 'confirm');
        if (e.message === 'no_shop' || e.message === 'shop_draft') { $('shop-name').textContent = user.email || ''; $('user-email').textContent = ''; $('btn-connect').hidden = true; }
        msg(ERR[e.message] || 'e_server');
      }
    });
  }

  $('f-login').onsubmit = async (e) => {
    e.preventDefault(); msg('');
    $('btn-login').disabled = true;
    try { await signInWithEmailAndPassword(auth, $('email').value.trim(), $('pass').value); }
    catch { msg('e_creds'); }
    $('btn-login').disabled = false;
  };
  $('btn-google').onclick = async () => {
    msg('');
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (e) { if (e && e.code !== 'auth/cancelled-popup-request') msg('e_popup'); }
  };
  $('lnk-switch').onclick = (e) => { e.preventDefault(); $('btn-connect').hidden = false; signOut(auth); };
  $('btn-connect').onclick = async () => {
    msg('');
    $('btn-connect').disabled = true;
    try { await call('connect'); view('done'); }
    catch (e) { msg(ERR[e.message] || 'e_server'); }
    $('btn-connect').disabled = false;
  };
  $('btn-close').onclick = () => { window.close(); };
</script>
</body>
</html>
