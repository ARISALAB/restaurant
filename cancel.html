<!DOCTYPE html>
<html lang="el">
<head>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #f0f2f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .logo {
      font-family: 'Sora', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #0f172a;
      margin-bottom: 24px;
    }
    .logo span { color: #2563eb; }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.04);
    }

    .icon { font-size: 3.5rem; margin-bottom: 16px; }

    h1 {
      font-family: 'Sora', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 10px;
      letter-spacing: -0.03em;
    }

    p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.65;
    }

    .booking-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 16px 20px;
      margin: 20px 0;
      text-align: center;
    }
    .booking-box .datetime {
      color: #1d4ed8;
      font-size: 1.3rem;
      font-weight: 800;
      font-family: 'Sora', sans-serif;
    }
    .booking-box .details {
      color: #3b82f6;
      font-size: 0.88rem;
      margin-top: 4px;
    }

    .warn-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 14px 18px;
      margin: 20px 0;
      color: #991b1b;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-family: 'Sora', sans-serif;
      transition: all 0.2s;
      width: 100%;
      margin-top: 10px;
    }
    .btn:hover { transform: translateY(-1px); }

    .btn-red {
      background: #ef4444;
      color: white;
      box-shadow: 0 4px 12px rgba(239,68,68,0.3);
    }
    .btn-red:hover { background: #dc2626; }
    .btn-red:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-gray {
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid #e2e8f0;
    }
    .btn-gray:hover { background: #e2e8f0; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      margin-top: 24px;
      color: #94a3b8;
      font-size: 0.78rem;
    }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; border-radius: 18px; }
      h1 { font-size: 1.2rem; }
    }
  </style>
</head>

    },

    const txt = TXT[lang];
    document.documentElement.lang = lang;
    document.title = txt.title + ' - TableReserve';
    const shopName = shopId ? shopId.charAt(0).toUpperCase() + shopId.slice(1).replace(/_/g,' ') : '';

    if (!token || !shopId || !bookingId) {
      card.innerHTML = `
        <div class="icon">❌</div>
        <h1>${txt.invalid_title}</h1>
        <p>${txt.invalid_desc}</p>
        <a href="https://tablereserve.gr" class="btn btn-gray" style="margin-top:20px;">${txt.back_home}</a>
      `;
    } else {
      card.innerHTML = `
        <div class="icon">🗓️</div>
        <h1>${txt.title}</h1>
        <p>${txt.confirm_q}</p>
        <div class="booking-box">
          <div class="datetime">${shopName}</div>
        </div>
        <div class="warn-box">${txt.warn}</div>
        <button class="btn btn-red" id="btn-cancel">${txt.btn_cancel}</button>
        <a href="https://tablereserve.gr/?shop=${shopId}&lang=${lang}" class="btn btn-gray">${txt.btn_back}</a>
      `;

      document.getElementById('btn-cancel').onclick = async () => {
        const btn = document.getElementById('btn-cancel');
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span> ${txt.cancelling}`;

        try {
          const res = await fetch(`${API}/cancel`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, shopId, bookingId })
          });
          const data = await res.json();

          if (data.success) {
            card.innerHTML = `
              <div class="icon">✅</div>
              <h1>${txt.success_title}</h1>
              <p>${txt.success_desc}</p>
              <a href="https://tablereserve.gr/?shop=${shopId}&lang=${lang}" class="btn btn-gray" style="margin-top:24px;">${txt.new_booking}</a>`;
          } else if (data.alreadyCancelled) {
            card.innerHTML = `
              <div class="icon">ℹ️</div>
              <h1>${txt.already_title}</h1>
              <p>${txt.already_desc}</p>
              <a href="https://tablereserve.gr/?shop=${shopId}&lang=${lang}" class="btn btn-gray" style="margin-top:24px;">${txt.new_booking}</a>`;
          } else if (data.error === 'too_late') {
            card.innerHTML = `
              <div class="icon">⏰</div>
              <h1>${txt.too_late_title}</h1>
              <p>${txt.too_late_desc}</p>
              <p style="margin-top:10px;">${txt.too_late_desc2}</p>
              <a href="https://tablereserve.gr/?shop=${shopId}&lang=${lang}" class="btn btn-gray" style="margin-top:24px;">${txt.back}</a>`;
          } else if (data.error === 'Μη έγκυρο token ακύρωσης' || data.error === 'Κράτηση δεν βρέθηκε') {
            card.innerHTML = `
              <div class="icon">🔒</div>
              <h1>${txt.invalid_token_t}</h1>
              <p>${txt.invalid_token_d}</p>
              <a href="https://tablereserve.gr/?shop=${shopId}&lang=${lang}" class="btn btn-gray" style="margin-top:24px;">${txt.back}</a>`;
          } else {
            btn.disabled = false;
            btn.innerHTML = txt.btn_cancel;
            alert(txt.error_generic);   // τα μηνύματα του server είναι στα ελληνικά, ο πελάτης βλέπει το δικό του
          }
        } catch (e) {
          btn.disabled = false;
          btn.innerHTML = txt.btn_cancel;
          alert(txt.conn_error);
        }
      };
    }
