<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ακύρωση Κράτησης - TableReserve</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #f0f2f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .logo {
      font-family: 'Sora', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #0f172a;
      margin-bottom: 24px;
    }
    .logo span { color: #2563eb; }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.04);
    }

    .icon { font-size: 3.5rem; margin-bottom: 16px; }

    h1 {
      font-family: 'Sora', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 10px;
      letter-spacing: -0.03em;
    }

    p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.65;
    }

    .booking-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 16px 20px;
      margin: 20px 0;
      text-align: center;
    }
    .booking-box .datetime {
      color: #1d4ed8;
      font-size: 1.3rem;
      font-weight: 800;
      font-family: 'Sora', sans-serif;
    }
    .booking-box .details {
      color: #3b82f6;
      font-size: 0.88rem;
      margin-top: 4px;
    }

    .warn-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 14px 18px;
      margin: 20px 0;
      color: #991b1b;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-family: 'Sora', sans-serif;
      transition: all 0.2s;
      width: 100%;
      margin-top: 10px;
    }
    .btn:hover { transform: translateY(-1px); }

    .btn-red {
      background: #ef4444;
      color: white;
      box-shadow: 0 4px 12px rgba(239,68,68,0.3);
    }
    .btn-red:hover { background: #dc2626; }
    .btn-red:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-gray {
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid #e2e8f0;
    }
    .btn-gray:hover { background: #e2e8f0; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      margin-top: 24px;
      color: #94a3b8;
      font-size: 0.78rem;
    }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; border-radius: 18px; }
      h1 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <div class="logo">Table<span>Reserve</span></div>

  <div class="card" id="card">
    <div class="icon">⏳</div>
    <h1>Φόρτωση...</h1>
    <p>Παρακαλώ περιμένετε.</p>
  </div>

  <div class="footer">TableReserve &bull; noreply@tablereserve.gr</div>

  <script>
    const API = 'https://tablereserve-api-838820261500.europe-west1.run.app';
    const params    = new URLSearchParams(window.location.search);
    const token     = params.get('token');
    const shopId    = params.get('shop');
    const bookingId = params.get('id');
    const lang      = params.get('lang') || 'el';
    const card      = document.getElementById('card');
    const isEn      = lang === 'en';
    const txt = isEn ? {
      invalid_title:   'Invalid Link',
      invalid_desc:    'The cancellation link is invalid or has expired.',
      back_home:       '← Home',
      title:           'Cancel Reservation',
      confirm_q:       'Are you sure you want to cancel your reservation?',
      warn:            '⚠️ Cancellation is only allowed up to <strong>2 hours</strong> before the reservation. After that, please contact the restaurant directly.',
      btn_cancel:      '❌ Yes, Cancel Reservation',
      btn_back:        '← Back to Restaurant',
      cancelling:      'Cancelling...',
      success_title:   'Reservation Cancelled',
      success_desc:    'Your reservation has been successfully cancelled.<br>Thank you for letting us know — we hope to see you soon!',
      new_booking:     '📅 New Reservation',
      already_title:   'Already Cancelled',
      already_desc:    'This reservation has already been cancelled.',
      too_late_title:  'Cancellation Not Allowed',
      too_late_desc:   'Cancellation is not possible within <strong>2 hours</strong> of the reservation time.',
      too_late_desc2:  'Please contact the restaurant directly.',
      back:            '← Back',
      invalid_token_t: 'Invalid Link',
      invalid_token_d: 'The cancellation link is not valid.',
      error_generic:   'Something went wrong. Please try again.',
      conn_error:      'Connection error. Please check your internet and try again.',
    } : {
      invalid_title:   'Μη έγκυρος σύνδεσμος',
      invalid_desc:    'Ο σύνδεσμος ακύρωσης δεν είναι έγκυρος ή έχει λήξει.',
      back_home:       '← Αρχική Σελίδα',
      title:           'Ακύρωση Κράτησης',
      confirm_q:       'Είστε σίγουροι ότι θέλετε να ακυρώσετε την κράτησή σας;',
      warn:            '⚠️ Η ακύρωση επιτρέπεται μόνο έως <strong>2 ώρες</strong> πριν την κράτηση. Μετά από αυτό το διάστημα, παρακαλώ επικοινωνήστε απευθείας με το κατάστημα.',
      btn_cancel:      '❌ Ναι, Ακύρωση Κράτησης',
      btn_back:        '← Πίσω στο Κατάστημα',
      cancelling:      'Ακύρωση...',
      success_title:   'Η κράτηση ακυρώθηκε',
      success_desc:    'Η κράτησή σας ακυρώθηκε επιτυχώς.<br>Σας ευχαριστούμε για την ενημέρωση και ελπίζουμε να σας δούμε σύντομα!',
      new_booking:     '📅 Νέα Κράτηση',
      already_title:   'Ήδη ακυρωμένη',
      already_desc:    'Η κράτηση αυτή έχει ήδη ακυρωθεί.',
      too_late_title:  'Δεν επιτρέπεται η ακύρωση',
      too_late_desc:   'Η ακύρωση δεν είναι δυνατή εντός <strong>2 ωρών</strong> από την ώρα της κράτησης.',
      too_late_desc2:  'Παρακαλώ επικοινωνήστε απευθείας με το κατάστημα.',
      back:            '← Πίσω',
      invalid_token_t: 'Μη έγκυρος σύνδεσμος',
      invalid_token_d: 'Ο σύνδεσμος ακύρωσης δεν είναι έγκυρος.',
      error_generic:   'Κάτι πήγε στραβά. Δοκιμάστε ξανά.',
      conn_error:      'Σφάλμα σύνδεσης. Ελέγξτε το internet και δοκιμάστε ξανά.',
    };
    const shopName = shopId ? shopId.charAt(0).toUpperCase() + shopId.slice(1).replace(/_/g,' ') : '';

    if (!token || !shopId || !bookingId) {
      card.innerHTML = `
        <div class="icon">❌</div>
        <h1>${txt.invalid_title}</h1>
        <p>${txt.invalid_desc}</p>
        <a href="https://tablereserve.gr" class="btn btn-gray" style="margin-top:20px;">${txt.back_home}</a>
      `;
    } else {
      card.innerHTML = `
        <div class="icon">🗓️</div>
        <h1>${txt.title}</h1>
        <p>${txt.confirm_q}</p>
        <div class="booking-box">
          <div class="datetime">${shopName}</div>
        </div>
        <div class="warn-box">${txt.warn}</div>
        <button class="btn btn-red" id="btn-cancel">${txt.btn_cancel}</button>
        <a href="https://tablereserve.gr/?shop=${shopId}" class="btn btn-gray">${txt.btn_back}</a>
      `;

      document.getElementById('btn-cancel').onclick = async () => {
        const btn = document.getElementById('btn-cancel');
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span> ${txt.cancelling}`;

        try {
          const res = await fetch(`${API}/v3/email/cancel`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, shopId, bookingId })
          });
          const data = await res.json();

          if (data.success) {
            card.innerHTML = `
              <div class="icon">✅</div>
              <h1>${txt.success_title}</h1>
              <p>${txt.success_desc}</p>
              <a href="https://tablereserve.gr/?shop=${shopId}" class="btn btn-gray" style="margin-top:24px;">${txt.new_booking}</a>`;
          } else if (data.alreadyCancelled) {
            card.innerHTML = `
              <div class="icon">ℹ️</div>
              <h1>${txt.already_title}</h1>
              <p>${txt.already_desc}</p>
              <a href="https://tablereserve.gr/?shop=${shopId}" class="btn btn-gray" style="margin-top:24px;">${txt.new_booking}</a>`;
          } else if (data.error === 'too_late') {
            card.innerHTML = `
              <div class="icon">⏰</div>
              <h1>${txt.too_late_title}</h1>
              <p>${txt.too_late_desc}</p>
              <p style="margin-top:10px;">${txt.too_late_desc2}</p>
              <a href="https://tablereserve.gr/?shop=${shopId}" class="btn btn-gray" style="margin-top:24px;">${txt.back}</a>`;
          } else if (data.error === 'Μη έγκυρο token ακύρωσης') {
            card.innerHTML = `
              <div class="icon">🔒</div>
              <h1>${txt.invalid_token_t}</h1>
              <p>${txt.invalid_token_d}</p>
              <a href="https://tablereserve.gr/?shop=${shopId}" class="btn btn-gray" style="margin-top:24px;">${txt.back}</a>`;
          } else {
            btn.disabled = false;
            btn.innerHTML = txt.btn_cancel;
            alert(data.error || txt.error_generic);
          }
        } catch (e) {
          btn.disabled = false;
          btn.innerHTML = txt.btn_cancel;
          alert(txt.conn_error);
        }
      };
    }
  </script>

</body>
</html>
